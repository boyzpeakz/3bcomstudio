<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title id="pageTitle">จองคิวบริการ</title>
  <style>
    :root {
      --brand: #53BDD7;
      --brand-dark: #3A9DB5;
      --brand-light: #E8F7FB;
      --ink: #1F2933;
      --muted: #7B8794;
      --danger: #E85D5D;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
      background: linear-gradient(160deg, var(--brand) 0%, #7fd4e8 45%, #f4fbfd 45%);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .hero {
      padding: 36px 20px 60px;
      text-align: center;
      color: #fff;
    }

    .hero .logo-circle {
      width: 64px; height: 64px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      font-size: 28px;
      backdrop-filter: blur(4px);
    }

    .hero h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .hero p { margin: 6px 0 0; font-size: 14px; opacity: 0.9; }

    .card {
      max-width: 480px;
      margin: -36px auto 0;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(30, 60, 70, 0.15);
      padding: 24px 20px 28px;
    }

    .liff-status {
      display: flex; align-items: center; gap: 10px;
      background: var(--brand-light);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--brand-dark);
    }

    .liff-status img { width: 28px; height: 28px; border-radius: 50%; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="number"],
    input[type="date"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #E4EAEE;
      border-radius: 10px;
      font-size: 15px;
      background: #FAFCFD;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(83,189,215,0.2);
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 6px;
    }

    .slot-btn {
      padding: 10px 6px;
      border-radius: 10px;
      border: 1.5px solid #E4EAEE;
      background: #fff;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: all .15s;
    }

    .slot-btn:hover:not(:disabled) { border-color: var(--brand); }

    .slot-btn.selected {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .slot-btn:disabled {
      background: #F3F5F6;
      color: #C3CBD1;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    .slot-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

    .service-options { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }

    .service-card {
      border: 1.5px solid #E4EAEE;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all .15s;
    }

    .service-card.selected {
      border-color: var(--brand);
      background: var(--brand-light);
    }

    .service-card-header {
      display: flex; align-items: center; gap: 10px;
      font-weight: 600; font-size: 14.5px;
    }

    .radio-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid #C3CBD1;
      flex-shrink: 0;
      position: relative;
    }

    .service-card.selected .radio-dot { border-color: var(--brand); }
    .service-card.selected .radio-dot::after {
      content: '';
      position: absolute; inset: 3px;
      border-radius: 50%;
      background: var(--brand);
    }

    .service-inputs {
      display: none;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #DCE4E8;
    }

    .service-inputs.active { display: grid; grid-template-columns: 1fr 1fr; }
    .service-inputs.active.single { grid-template-columns: 1fr; }

    .field-mini label { margin: 0 0 4px; font-size: 12px; }

    .submit-btn {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(83,189,215,0.35);
      transition: transform .1s;
    }

    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      display: none;
    }

    .msg-box.success { background: #E6F8EF; color: #1E9A5C; display: block; }
    .msg-box.error { background: #FDECEC; color: var(--danger); display: block; }

    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="hero">
    <div class="logo-circle">🖥️</div>
    <h1 id="storeNameHeading">กำลังโหลด...</h1>
    <p>จองคิวใช้บริการล่วงหน้าได้ง่าย ๆ ผ่าน LINE</p>
  </div>

  <div class="card">
    <div class="liff-status" id="liffStatus">
      <span>⏳ กำลังเชื่อมต่อ LINE...</span>
    </div>

    <form id="bookingForm">
      <label for="name">ชื่อ - นามสกุล</label>
      <input type="text" id="name" placeholder="เช่น สมชาย ใจดี" required>

      <label for="phone">เบอร์โทรติดต่อ</label>
      <input type="tel" id="phone" placeholder="08x-xxx-xxxx" pattern="[0-9]{9,10}" required>

      <label for="date">เลือกวันที่ต้องการใช้บริการ</label>
      <input type="date" id="date" required>

      <label>เลือกช่วงเวลา (ช่วงละ 1 ชม.)</label>
      <div class="slots-grid" id="slotsGrid">
        <div class="slot-hint">กรุณาเลือกวันที่ก่อน</div>
      </div>

      <label>บริการที่ต้องการ</label>
      <div class="service-options">
        <div class="service-card" data-service="program" id="cardProgram">
          <div class="service-card-header">
            <div class="radio-dot"></div>
            <span>💿 ติดตั้งโปรแกรม</span>
          </div>
          <div class="service-inputs" id="inputsProgram">
            <div class="field-mini">
              <label for="programCount">จำนวนโปรแกรม</label>
              <input type="number" id="programCount" min="1" placeholder="เช่น 3">
            </div>
            <div class="field-mini">
              <label for="programMachineCount">จำนวนเครื่อง</label>
              <input type="number" id="programMachineCount" min="1" placeholder="เช่น 1">
            </div>
          </div>
        </div>

        <div class="service-card" data-service="windows" id="cardWindows">
          <div class="service-card-header">
            <div class="radio-dot"></div>
            <span>🪟 ติดตั้ง Windows</span>
          </div>
          <div class="service-inputs single" id="inputsWindows">
            <div class="field-mini">
              <label for="windowsMachineCount">จำนวนเครื่อง</label>
              <input type="number" id="windowsMachineCount" min="1" placeholder="เช่น 1">
            </div>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span id="submitLabel">ยืนยันการจอง</span>
        <div class="spinner" id="spinner"></div>
      </button>

      <div class="msg-box" id="msgBox"></div>
    </form>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ==========================================================
    // ตั้งค่า 2 ค่านี้ให้ตรงกับของจริงก่อนใช้งาน
    // ==========================================================
    const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbx4ogmGcXH5zBZFOM5SfQg2Mn81HmPfi-upiEboDNE_uDsgDGNcsXoCVJPJ0VM4X5gExg/exec'; // URL จาก Deploy > Web app (Code.gs)
    const LIFF_ID = '2007095838-sQlusoDC'; // LIFF ID จาก LINE Developers Console
    // ==========================================================

    let lineProfile = null;
    let selectedSlot = null;
    let selectedService = null;

    // ---------- โหลดค่าตั้งค่าทั่วไปจาก GAS (ชื่อร้าน, เวลาเปิด-ปิด) ----------
    async function loadConfig() {
      try {
        const res = await fetch(WEBAPP_URL + '?action=config');
        const data = await res.json();
        if (data.success) {
          document.getElementById('storeNameHeading').textContent = data.storeName;
          document.getElementById('pageTitle').textContent = data.storeName + ' | จองคิวบริการ';
        }
      } catch (err) {
        document.getElementById('storeNameHeading').textContent = 'จองคิวบริการ';
      }
    }
    loadConfig();

    // ---------- LIFF INIT ----------
    async function initLiff() {
      const statusEl = document.getElementById('liffStatus');
      if (!LIFF_ID || LIFF_ID.indexOf('XXXX') !== -1) {
        statusEl.innerHTML = '<span>⚠️ ยังไม่ได้ตั้งค่า LIFF_ID ในไฟล์นี้ (ระบบยังใช้งานได้ปกติ แต่จะไม่ส่งแจ้งเตือนทาง LINE)</span>';
        return;
      }
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        lineProfile = await liff.getProfile();
        statusEl.innerHTML =
          '<img src="' + (lineProfile.pictureUrl || '') + '" onerror="this.style.display=\'none\'">' +
          '<span>เข้าสู่ระบบด้วย LINE: <strong>' + lineProfile.displayName + '</strong></span>';
      } catch (err) {
        statusEl.innerHTML = '<span>⚠️ เชื่อมต่อ LINE ไม่สำเร็จ (' + err.message + ')</span>';
      }
    }
    initLiff();

    // ---------- DATE -> SLOTS ----------
    const dateInput = document.getElementById('date');
    const today = new Date();
    dateInput.min = today.toISOString().split('T')[0];

    dateInput.addEventListener('change', async function () {
      selectedSlot = null;
      const grid = document.getElementById('slotsGrid');
      grid.innerHTML = '<div class="slot-hint">⏳ กำลังโหลดช่วงเวลาว่าง...</div>';

      try {
        const res = await fetch(WEBAPP_URL + '?action=getSlots&date=' + encodeURIComponent(dateInput.value));
        const data = await res.json();
        if (data.success) {
          renderSlots(data.slots);
        } else {
          grid.innerHTML = '<div class="slot-hint">โหลดข้อมูลไม่สำเร็จ: ' + data.message + '</div>';
        }
      } catch (err) {
        grid.innerHTML = '<div class="slot-hint">โหลดข้อมูลไม่สำเร็จ: ' + err.message + '</div>';
      }
    });

    function renderSlots(slots) {
      const grid = document.getElementById('slotsGrid');
      grid.innerHTML = '';
      slots.forEach(function (s) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'slot-btn';
        btn.textContent = s.slot;
        btn.disabled = !s.available;
        if (!s.available) btn.title = 'ช่วงเวลานี้ถูกจองแล้ว';
        btn.addEventListener('click', function () {
          document.querySelectorAll('.slot-btn').forEach(function (b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          selectedSlot = s.slot;
        });
        grid.appendChild(btn);
      });
    }

    // ---------- SERVICE SELECTION ----------
    document.querySelectorAll('.service-card').forEach(function (card) {
      card.addEventListener('click', function (e) {
        if (e.target.tagName === 'INPUT') return; // อย่าให้การพิมพ์ตัวเลขไปสลับ service
        document.querySelectorAll('.service-card').forEach(function (c) {
          c.classList.remove('selected');
          c.querySelector('.service-inputs').classList.remove('active');
        });
        card.classList.add('selected');
        card.querySelector('.service-inputs').classList.add('active');
        selectedService = card.dataset.service;
      });
    });

    // ---------- SUBMIT ----------
    document.getElementById('bookingForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const msgBox = document.getElementById('msgBox');
      msgBox.className = 'msg-box';
      msgBox.textContent = '';

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const date = dateInput.value;

      if (!name || !phone || !date) {
        return showMsg('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
      }
      if (!selectedSlot) {
        return showMsg('กรุณาเลือกช่วงเวลาที่ต้องการ', 'error');
      }
      if (!selectedService) {
        return showMsg('กรุณาเลือกบริการที่ต้องการ', 'error');
      }

      const formData = {
        action: 'submitBooking',
        name: name,
        phone: phone,
        date: date,
        slot: selectedSlot,
        service: selectedService,
        programCount: document.getElementById('programCount').value,
        programMachineCount: document.getElementById('programMachineCount').value,
        windowsMachineCount: document.getElementById('windowsMachineCount').value,
        lineUserId: lineProfile ? lineProfile.userId : '',
        lineDisplayName: lineProfile ? lineProfile.displayName : ''
      };

      if (selectedService === 'program' && (!formData.programCount || !formData.programMachineCount)) {
        return showMsg('กรุณาระบุจำนวนโปรแกรมและจำนวนเครื่อง', 'error');
      }
      if (selectedService === 'windows' && !formData.windowsMachineCount) {
        return showMsg('กรุณาระบุจำนวนเครื่อง', 'error');
      }

      setLoading(true);
      try {
        // ส่งเป็น text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script Web App ไม่รองรับ
        const res = await fetch(WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(formData)
        });
        const result = await res.json();
        setLoading(false);

        if (result.success) {
          showMsg('🎉 ' + result.message, 'success');
          document.getElementById('bookingForm').reset();
          document.getElementById('slotsGrid').innerHTML = '<div class="slot-hint">กรุณาเลือกวันที่ก่อน</div>';
          document.querySelectorAll('.service-card').forEach(function (c) {
            c.classList.remove('selected');
            c.querySelector('.service-inputs').classList.remove('active');
          });
          selectedSlot = null;
          selectedService = null;
        } else {
          showMsg(result.message, 'error');
        }
      } catch (err) {
        setLoading(false);
        showMsg('เกิดข้อผิดพลาด: ' + err.message, 'error');
      }
    });

    function showMsg(text, type) {
      const msgBox = document.getElementById('msgBox');
      msgBox.className = 'msg-box ' + type;
      msgBox.textContent = text;
    }

    function setLoading(isLoading) {
      document.getElementById('submitBtn').disabled = isLoading;
      document.getElementById('submitLabel').style.display = isLoading ? 'none' : 'inline';
      document.getElementById('spinner').style.display = isLoading ? 'block' : 'none';
    }
  </script>
</body>
</html>
